<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loja — Clínica Vittalit</title>
<meta name="description" content="Loja online da Clínica Vittalit — produtos selecionados pela nossa equipe.">
<link rel="icon" type="image/png" href="../img/favicon.png">
<style>
@font-face {
  font-family: 'Jakarta';
  src: url('../fonts/jakarta.woff2') format('woff2');
  font-weight: 200 800;
  font-display: swap;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: 'Jakarta', 'Segoe UI', system-ui, sans-serif;
  background: #f4f9fd; color: #10243c;
  display: flex; flex-direction: column;
  -webkit-font-smoothing: antialiased;
}
.bar {
  display: flex; align-items: center; gap: 12px;
  background: rgba(255,255,255,.92); backdrop-filter: blur(10px);
  border-bottom: 1px solid rgba(7,32,63,.09); padding: 10px 18px;
  flex: none;
}
.bar img { height: 34px; }
.bar b { font-size: .98rem; color: #07203f; letter-spacing: .04em; }
.bar small { display: block; font-size: .68rem; letter-spacing: .3em; color: #00AEEF; font-weight: 700; margin-top: -2px; }
.bar .grow { flex: 1; }
.bar a {
  text-decoration: none; font-weight: 700; font-size: .84rem;
  padding: 9px 16px; border-radius: 999px; white-space: nowrap;
}
.back { color: #5b7186; }
.back:hover { color: #0284c7; background: rgba(0,174,239,.1); }
.open {
  background: linear-gradient(120deg, #00aeef, #38c6ff 55%, #7ee0ff); color: #fff;
  box-shadow: 0 10px 26px -10px rgba(0,174,239,.5);
}
.open:hover { transform: translateY(-1px); }
.frame-wrap { flex: 1; position: relative; }
iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
.loading {
  position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
  color: #5b7186; font-weight: 600; padding: 24px; background: #f4f9fd;
}
.loading .spin {
  width: 42px; height: 42px; margin: 0 auto 16px; border-radius: 50%;
  border: 4px solid rgba(0,174,239,.2); border-top-color: #00AEEF;
  animation: sp 1s linear infinite;
}
@keyframes sp { to { transform: rotate(360deg); } }
.loading a { color: #0284c7; font-weight: 700; }
@media (max-width: 520px) { .bar b small { display: none; } .back { display: none; } }
</style>
</head>
<body>

<div class="bar">
  <img src="../img/logo-icon.png" alt="Clínica Vittalit">
  <div><b>VITTALIT<small>LOJA ONLINE</small></b></div>
  <div class="grow"></div>
  <a class="back" href="../index.html">← Voltar ao site</a>
  <a class="open" id="openBtn" href="https://executiva.velmoraapp.com/a/clinicavittalit" target="_blank" rel="noopener">Abrir em nova aba ↗</a>
</div>

<div class="frame-wrap">
  <div class="loading" id="loading">
    <div>
      <div class="spin"></div>
      Carregando a loja…<br>
      <small style="font-weight:500">Se não carregar em alguns segundos,
      <a id="fallbackLink" href="https://executiva.velmoraapp.com/a/clinicavittalit" target="_blank" rel="noopener">clique aqui para abrir em nova aba</a>.</small>
    </div>
  </div>
  <iframe id="storeFrame" title="Loja online da Clínica Vittalit" allow="payment"></iframe>
</div>

<script src="../js/config.js?v=4"></script>
<script>
(async () => {
  const FALLBACK = 'https://executiva.velmoraapp.com/a/clinicavittalit';
  let url = FALLBACK;
  try {
    const cfg = window.VITTALIT;
    const res = await fetch(`${cfg.SUPABASE_URL}/rest/v1/vittalit_settings?select=value&key=eq.store_url`, {
      headers: { apikey: cfg.SUPABASE_ANON_KEY, Authorization: `Bearer ${cfg.SUPABASE_ANON_KEY}` },
    });
    if (res.ok) {
      const rows = await res.json();
      if (rows[0]?.value) url = rows[0].value;
    }
  } catch { /* usa o padrão */ }

  document.getElementById('openBtn').href = url;
  document.getElementById('fallbackLink').href = url;
  const frame = document.getElementById('storeFrame');
  frame.src = url;
  // se a loja carregar, esconde o aviso; se o servidor dela bloquear iframe,
  // o aviso permanece com o link de abrir em nova aba
  frame.addEventListener('load', () => {
    setTimeout(() => { document.getElementById('loading').style.display = 'none'; }, 400);
  });
})();
</script>
</body>
</html>
